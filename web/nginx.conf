server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must be re-checked on every load, or an open tab keeps running the
    # previous build's js after a deploy. the js and css files have hashed names,
    # so they can be cached safely
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # agent runs wait on the model synchronously (run, inbox email, and Approve via
    # java -> /resume). a busy model can take over a minute; the default is 60s
    location /api/   { proxy_pass http://platform:8080/; proxy_read_timeout 180s; }
    location /agent/ { proxy_pass http://agent:8100/; proxy_read_timeout 180s; }
}
