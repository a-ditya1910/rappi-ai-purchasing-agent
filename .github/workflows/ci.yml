# Every push and pull request: the java unit tests, the python tests, the eval
# suite in replay mode, and the web build. Nothing here needs a database, redis
# or a gemini key - the integration tests (*IT) need docker compose and run locally.
name: ci

on:
  push:
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: unit tests
        run: ./mvnw -B -q test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: pytest
        working-directory: agent
        run: pytest -q
      - name: evals (replay recorded runs, no api key)
        run: python evals/run_evals.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
